network:
    name: LinkTest

server:
    name: ircd-a.test
    sid: "001"
    casemapping: ascii
    allowed-characters:
        irc-formatting: true
        printable-glyphs: true
    max-line-len: 4096
    max-sendq: 10M
    listeners:
        ":6667":
    links:
        ircd-b:
            name: ircd-b.test
            sid: "002"
            hostname: ircd-b
            port: 6667
            # set tls to true to enable TLS/SSL (defaults to port 6697 if port is omitted):
            # tls: true
            send-password: link-test
            receive-password: link-test
            auto-connect: true

datastore:
    path: ircd.db

logging:
    -
        method: stderr
        type: "server s2s"
        level: info

limits:
    nicklen: 32
    identlen: 20
    realnamelen: 150
    channellen: 64
    awaylen: 390
    kicklen: 390
    topiclen: 390
    chan-list-modes: 60
